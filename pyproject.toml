[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-template-compiler"
version = "0.1.0"
description = "Jinja-like zero-dependency compiled prompt template engine with strict validation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
prompt-template-compiler = "prompt_template_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_template_compiler*"]
